services:
  gateway:
    build: ./gateway
    ports:
      - "3000:3000"  # WebSocket
      - "4000:4000"  # HTTP
    networks:
      - raft-network
    depends_on:
      - replica1
      - replica2
      - replica3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  replica1:
    build: ./replica1
    volumes:
      - ./replica1:/app
      - /app/node_modules
    ports:
      - "5001:5001"
    networks:
      - raft-network
    environment:
      - NODE_ID=replica1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  replica2:
    build: ./replica2
    volumes:
      - ./replica2:/app
      - /app/node_modules
    ports:
      - "5002:5002"
    networks:
      - raft-network
    environment:
      - NODE_ID=replica2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  replica3:
    build: ./replica3
    volumes:
      - ./replica3:/app
      - /app/node_modules
    ports:
      - "5003:5003"
    networks:
      - raft-network
    environment:
      - NODE_ID=replica3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  raft-network:
    driver: bridge
